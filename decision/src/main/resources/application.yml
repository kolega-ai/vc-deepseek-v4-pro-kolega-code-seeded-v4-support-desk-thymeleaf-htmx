server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: decision
  datasource:
    url: ${DB_DECISION_URL:jdbc:postgresql://localhost:15432/decision}
    username: ${DB_USER:relay}
    password: ${DB_PASSWORD:relay-dev-only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

# Decision tier secrets. Empty defaults make the app fail fast at startup
# when the required secrets are not injected (see DecisionProperties @NotBlank).
decision:
  session-token-secret: ${SESSION_TOKEN_SECRET:}
  scope-token-secret: ${SCOPE_TOKEN_SECRET:}
  channel-internal-key: ${CHANNEL_INTERNAL_KEY:}
