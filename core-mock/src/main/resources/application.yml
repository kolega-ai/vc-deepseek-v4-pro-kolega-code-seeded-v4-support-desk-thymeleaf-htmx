server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: core-mock
  datasource:
    url: ${DB_CORE_URL:jdbc:postgresql://localhost:15432/core}
    username: ${DB_USER:relay}
    password: ${DB_PASSWORD:relay-dev-only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

# External-system credentials of the fictional vendor CRM "Lumina Customer Core".
# Blank values (e.g. missing env vars) fail startup via @NotBlank on CoreProperties.
core:
  scope-token-secret: ${SCOPE_TOKEN_SECRET:}
  internal-key: ${CORE_INTERNAL_KEY:}
