<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Choose a new password — RelayDesk')}"></head>
<body th:replace="~{layout :: auth(~{::content}, 'Choose a new password')}">
  <div th:fragment="content">

    <th:block th:if="${valid != null and valid}">
      <h1>Choose a new password</h1>
      <p class="auth-sub">At least 10 characters. Use something you do not use elsewhere.</p>

      <!-- Posts to the current URL so the one-time token in the query string is preserved. -->
      <form method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="field">
          <label class="field-label" for="password">New password</label>
          <input type="password" id="password" name="password" autocomplete="new-password"
                 required minlength="10" maxlength="100"/>
        </div>
        <div class="field">
          <label class="field-label" for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password"
                 required minlength="10" maxlength="100"/>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-block">Set new password</button>
        </div>
      </form>
    </th:block>

    <th:block th:unless="${valid != null and valid}">
      <h1>Reset link not valid</h1>
      <p class="auth-sub">This reset link is expired, already used, or malformed.
        Request a fresh one and try again.</p>
      <div class="form-actions">
        <a class="btn btn-primary" th:href="@{/forgot-password}">Request a new link</a>
        <a class="btn" th:href="@{/login}">Back to sign in</a>
      </div>
    </th:block>

  </div>
</body>
</html>
