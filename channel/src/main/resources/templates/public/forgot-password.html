<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Reset password — RelayDesk')}"></head>
<body th:replace="~{layout :: auth(~{::content}, 'Reset password')}">
  <div th:fragment="content">
    <h1>Forgot your password?</h1>
    <p class="auth-sub">Enter your email address and we will send you a link to reset your password.</p>

    <form th:action="@{/forgot-password}" method="post">
      <div class="field">
        <label class="field-label" for="email">Email address</label>
        <input type="email" id="email" name="email" autocomplete="email" required
               placeholder="you@example.com"
               th:value="${form?.email}"/>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
      </div>
    </form>

    <div class="auth-foot">
      <a th:href="@{/login}">‹ Back to sign in</a>
    </div>
  </div>
</body>
</html>
