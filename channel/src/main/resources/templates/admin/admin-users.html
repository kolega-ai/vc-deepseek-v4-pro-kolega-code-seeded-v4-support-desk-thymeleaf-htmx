<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Users — RelayDesk Admin')}"></head>
<body th:replace="~{layout :: shell(~{::content}, 'Users', 'users', ~{})}">
  <main th:fragment="content">

    <div class="page-head">
      <div>
        <h1 class="page-title">Users</h1>
        <p class="page-sub">Support users and customer accounts. Roles and enablement live in the decision tier.</p>
      </div>
      <a class="btn" th:href="@{/admin/invites}">Invites</a>
    </div>

    <div class="config-grid">
      <div class="card">
        <h2 class="card-title">Create support user</h2>
        <form th:action="@{/admin/users}" method="post">
          <div class="field">
            <label class="field-label req" for="u-email">Email</label>
            <input type="email" id="u-email" name="email" required maxlength="255" th:value="${userForm?.email}"/>
          </div>
          <div class="field">
            <label class="field-label req" for="u-name">Display name</label>
            <input type="text" id="u-name" name="displayName" required maxlength="120" th:value="${userForm?.displayName}"/>
          </div>
          <div class="field">
            <label class="field-label req" for="u-role">Role</label>
            <select id="u-role" name="role">
              <option value="SUPPORT_AGENT" th:selected="${userForm?.role?.name() == 'SUPPORT_AGENT'}">Support agent</option>
              <option value="TEAM_LEAD" th:selected="${userForm?.role?.name() == 'TEAM_LEAD'}">Team lead</option>
              <option value="SUPPORT_ADMIN" th:selected="${userForm?.role?.name() == 'SUPPORT_ADMIN'}">Support admin</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label">Teams</label>
            <th:block th:each="t : ${teams != null ? teams : {}}">
              <label class="check-line">
                <input type="checkbox" name="teamIds" th:value="${t.id}"
                       th:checked="${userForm != null and userForm.teamIds != null and userForm.teamIds.contains(t.id)}"/>
                <span th:text="${t.name}">Team</span>
              </label>
            </th:block>
          </div>
          <div class="field">
            <label class="check-line">
              <input type="checkbox" name="enabled" value="true"
                     th:checked="${userForm == null or userForm.enabled}"/>
              <span>Enabled</span>
            </label>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Create user</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h2 class="card-title">Invite a customer</h2>
        <p class="field-hint">Sends an invitation email with an accept link (mocked outbox locally).</p>
        <form th:action="@{/admin/users/invite}" method="post">
          <div class="field">
            <label class="field-label req" for="i-email">Email</label>
            <input type="email" id="i-email" name="email" required maxlength="255" th:value="${inviteForm?.email}"/>
          </div>
          <div class="field">
            <label class="field-label req" for="i-name">Display name</label>
            <input type="text" id="i-name" name="displayName" required maxlength="120" th:value="${inviteForm?.displayName}"/>
          </div>
          <div class="field">
            <label class="field-label req" for="i-org">Organisation</label>
            <select id="i-org" name="orgId" required>
              <option value="" disabled th:selected="${inviteForm == null or inviteForm.orgId == null}">Choose an organisation…</option>
              <option th:each="o : ${orgs != null ? orgs : {}}" th:value="${o.id}" th:text="${o.name}"
                      th:selected="${inviteForm != null and inviteForm.orgId != null and inviteForm.orgId.toString() == o.id.toString()}">Org</option>
            </select>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Send invite</button>
          </div>
        </form>
      </div>
    </div>

    <h2 class="card-title" style="margin-top:1.2rem;">User directory</h2>

    <form class="filter-bar" th:action="@{/admin/users}" method="get"
          hx-get="/admin/users/fragment"
          hx-target="#user-rows"
          hx-trigger="submit, change delay:200ms from:select, change from:input[type=checkbox]"
          hx-swap="outerHTML">
      <div class="field field--q">
        <label class="field-label" for="uf-q">Search</label>
        <input type="search" id="uf-q" name="q" placeholder="Email or display name…" th:value="${filter?.q}"/>
      </div>
      <div class="field">
        <label class="field-label" for="uf-role">Role</label>
        <select id="uf-role" name="role">
          <option value="" th:selected="${filter == null or filter.role == null}">All roles</option>
          <option value="SUPPORT_ADMIN" th:selected="${filter != null and filter.role != null and filter.role.name() == 'SUPPORT_ADMIN'}">Support admin</option>
          <option value="TEAM_LEAD" th:selected="${filter != null and filter.role != null and filter.role.name() == 'TEAM_LEAD'}">Team lead</option>
          <option value="SUPPORT_AGENT" th:selected="${filter != null and filter.role != null and filter.role.name() == 'SUPPORT_AGENT'}">Support agent</option>
          <option value="CUSTOMER_USER" th:selected="${filter != null and filter.role != null and filter.role.name() == 'CUSTOMER_USER'}">Customer</option>
        </select>
      </div>
      <div class="field field--check">
        <label class="check-line">
          <input type="checkbox" name="enabledOnly" value="true" th:checked="${filter != null and filter.enabledOnly}"/>
          <span>Enabled only</span>
        </label>
      </div>
      <div class="filter-actions">
        <button type="submit" class="btn btn-primary btn-sm">Search</button>
        <a class="btn btn-ghost btn-sm" th:href="@{/admin/users}">Clear</a>
      </div>
    </form>

    <div th:replace="~{fragments :: userRows(${page}, ${filter})}"></div>

  </main>
</body>
</html>
