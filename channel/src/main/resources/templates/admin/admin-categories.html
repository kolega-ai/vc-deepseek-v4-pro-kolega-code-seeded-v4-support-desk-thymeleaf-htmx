<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Categories — RelayDesk Admin')}"></head>
<body th:replace="~{layout :: shell(~{::content}, 'Categories', 'categories', ~{})}">
  <main th:fragment="content">

    <div class="page-head">
      <div>
        <h1 class="page-title">Categories</h1>
        <p class="page-sub">Ticket categories and their default routing teams.</p>
      </div>
    </div>

    <div class="card">
      <div class="empty" th:if="${categories == null or #lists.isEmpty(categories)}">
        <span class="empty__icon" aria-hidden="true">◇</span>
        <p class="empty__title">No categories yet</p>
      </div>

      <div class="table-wrap" th:unless="${categories == null or #lists.isEmpty(categories)}">
        <table class="table">
          <thead>
            <tr><th>Name</th><th>Status</th><th>Default team</th><th>Description</th><th></th></tr>
          </thead>
          <tbody>
            <tr th:each="c : ${categories}">
              <td class="cell-main" th:text="${c.name}">Category</td>
              <td>
                <span class="badge badge--green" th:if="${c.active}"><span class="badge-dot" aria-hidden="true"></span>Active</span>
                <span class="badge badge--gray" th:unless="${c.active}"><span class="badge-dot" aria-hidden="true"></span>Inactive</span>
              </td>
              <td>
                <span th:if="${#objects.nullSafe(categories[0], 'defaultTeamName') != null}" th:text="${c.defaultTeamName != null} ? ${c.defaultTeamName} : '—'">—</span>
                <span class="mono small muted" th:if="${#objects.nullSafe(categories[0], 'defaultTeamName') == null}"
                      th:text="${c.defaultTeamId != null} ? ${c.defaultTeamId} : '—'">—</span>
              </td>
              <td class="truncate small muted" th:text="${c.description}">desc</td>
              <td class="cell-slim">
                <div class="row" style="gap:0.4rem;">
                  <form th:action="@{/admin/categories/{id}(id=${c.id})}" method="post" class="inline-edit">
                    <input type="text" name="name" required maxlength="100" aria-label="Category name" th:value="${c.name}"/>
                    <input type="text" name="description" maxlength="500" aria-label="Category description" th:value="${c.description}"/>
                    <select name="defaultTeamId" aria-label="Default team">
                      <option value="" th:selected="${c.defaultTeamId == null}">No default team</option>
                      <option th:each="t : ${teams != null ? teams : {}}" th:value="${t.id}" th:text="${t.name}"
                              th:selected="${c.defaultTeamId != null and c.defaultTeamId.toString() == t.id.toString()}">Team</option>
                    </select>
                    <button type="submit" class="btn btn-sm btn-primary">Save</button>
                  </form>
                  <form th:action="@{/admin/categories/{id}/delete(id=${c.id})}" method="post" th:if="${c.active}">
                    <button type="submit" class="btn btn-sm btn-warn"
                            data-confirm="Deactivate this category? It stops appearing in new-ticket forms.">Deactivate</button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card" style="max-width:560px; margin-top:1.1rem;">
      <h2 class="card-title">Create category</h2>
      <form th:action="@{/admin/categories}" method="post">
        <div class="field">
          <label class="field-label req" for="c-name">Name</label>
          <input type="text" id="c-name" name="name" required maxlength="100" th:value="${categoryForm?.name}"/>
        </div>
        <div class="field">
          <label class="field-label" for="c-desc">Description</label>
          <input type="text" id="c-desc" name="description" maxlength="500" th:value="${categoryForm?.description}"/>
        </div>
        <div class="field">
          <label class="field-label" for="c-team">Default team</label>
          <select id="c-team" name="defaultTeamId">
            <option value="" th:selected="${categoryForm == null or categoryForm.defaultTeamId == null}">No default team</option>
            <option th:each="t : ${teams != null ? teams : {}}" th:value="${t.id}" th:text="${t.name}"
                    th:selected="${categoryForm != null and categoryForm.defaultTeamId != null and categoryForm.defaultTeamId.toString() == t.id.toString()}">Team</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Create category</button>
        </div>
      </form>
    </div>

  </main>
</body>
</html>
