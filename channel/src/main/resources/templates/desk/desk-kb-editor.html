<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Article editor — RelayDesk')}"></head>
<body th:replace="~{layout :: shell(~{::content}, 'Article editor', 'kb-editor', ~{})}">
  <main th:fragment="content">

    <p><a th:href="@{/desk/kb}">‹ Back to Knowledge Base</a></p>

    <div class="page-head">
      <div>
        <h1 class="page-title" th:text="${article != null} ? 'Edit article' : 'New article'">Edit article</h1>
        <p class="page-sub" th:text="${article != null} ? 'Edit the article body, then submit or publish.' : 'Write a new knowledge base article as a draft.'">Subtitle</p>
      </div>
      <th:block th:if="${article != null}">
        <div class="row" style="flex-wrap:wrap;">
          <th:block th:replace="~{fragments :: kbStatusBadge(${article.status}, ${article.internalOnly})}">status</th:block>
          <a class="btn btn-sm" th:href="@{/kb/{slug}(slug=${article.slug})}"
             th:if="${article.status != null and article.status.name() == 'PUBLISHED' and !article.internalOnly}">View public page</a>
        </div>
      </th:block>
    </div>

    <div class="card" style="max-width:860px;">
      <form th:action="${article != null} ? @{/desk/kb/{id}(id=${article.id})} : @{/desk/kb}" method="post">
        <div class="form-grid">
          <div class="field field--wide">
            <label class="field-label req" for="kb-title">Title</label>
            <input type="text" id="kb-title" name="title" required maxlength="200"
                   th:value="${form?.title} ?: ${article?.title}"/>
          </div>
          <div class="field">
            <label class="field-label" for="kb-category">Category</label>
            <select id="kb-category" name="categoryId">
              <option value="" th:selected="${(form == null or form.categoryId == null) and (article == null or article.categoryId == null)}">Uncategorised</option>
              <option th:each="c : ${categories != null ? categories : {}}" th:value="${c.id}" th:text="${c.name}"
                      th:selected="${(form != null and form.categoryId != null and form.categoryId.toString() == c.id.toString()) or (form == null and article != null and article.categoryId != null and article.categoryId.toString() == c.id.toString())}">Category</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label" for="kb-tags">Tags <span class="muted">(comma-separated)</span></label>
            <input type="text" id="kb-tags" name="tags" maxlength="500"
                   placeholder="billing, invoices"
                   th:value="${form?.tags} ?: ${article?.tags}"/>
          </div>
          <div class="field field--wide">
            <label class="check-line">
              <input type="checkbox" name="internalOnly" value="true"
                     th:checked="${(form != null and form.internalOnly) or (form == null and article != null and article.internalOnly)}"/>
              <span>Internal article</span>
            </label>
            <p class="field-hint">Internal articles stay staff-only even when published.</p>
          </div>
          <div class="field field--wide">
            <label class="field-label req" for="kb-body">Body</label>
            <textarea id="kb-body" name="body" required maxlength="20000" rows="16"
                      th:text="${form?.body} ?: ${article?.body}"></textarea>
            <p class="field-hint">Plain text; line breaks preserved.</p>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" th:text="${article != null} ? 'Save article' : 'Create draft'">Save</button>
          <a class="btn" th:href="@{/desk/kb/preview/{s}(s='Hello author')}" target="_blank">Preview markup</a>
          <a class="btn" th:href="@{/desk/kb}">Cancel</a>
        </div>
      </form>

      <!-- Workflow actions -->
      <th:block th:if="${article != null}">
        <hr/>
        <h2 class="card-title">Workflow</h2>
        <div class="row" style="flex-wrap:wrap; gap:0.6rem;">

          <form th:action="@{/desk/kb/{id}/submit(id=${article.id})}" method="post"
                th:if="${article.status != null and article.status.name() == 'DRAFT'}">
            <button type="submit" class="btn btn-primary">Submit for review</button>
          </form>

          <th:block sec:authorize="hasAnyRole('ROLE_TEAM_LEAD','ROLE_SUPPORT_ADMIN')"
                    th:if="${article.status != null and article.status.name() == 'IN_REVIEW'}">
            <form th:action="@{/desk/kb/{id}/publish(id=${article.id})}" method="post">
              <button type="submit" class="btn btn-primary">Publish</button>
            </form>
            <form th:action="@{/desk/kb/{id}/send-back(id=${article.id})}" method="post" class="row">
              <input type="text" name="reason" required maxlength="2000" placeholder="Reason to send back…"
                     th:value="${reviewForm?.reason}" style="width:auto; min-width:220px;"/>
              <button type="submit" class="btn">Send back</button>
            </form>
          </th:block>

          <form th:action="@{/desk/kb/{id}/archive(id=${article.id})}" method="post"
                th:if="${article.status != null and article.status.name() == 'PUBLISHED'}">
            <button type="submit" class="btn btn-warn" data-confirm="Archive this published article? Customers will no longer see it.">Archive</button>
          </form>

          <form th:action="@{/desk/kb/{id}/restore(id=${article.id})}" method="post"
                th:if="${article.status != null and article.status.name() == 'ARCHIVED'}">
            <button type="submit" class="btn">Restore to draft</button>
          </form>
        </div>
      </th:block>
    </div>

  </main>
</body>
</html>
