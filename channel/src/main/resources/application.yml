server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax
        secure: false # local dev over plain HTTP; set to true behind TLS in production
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: channel
  datasource:
    url: ${DB_CHANNEL_URL:jdbc:postgresql://localhost:15432/channel}
    username: ${DB_USER:relay}
    # local dev-only default; always override in production
    password: ${DB_PASSWORD:relay-dev-only}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  thymeleaf:
    cache: false
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:*}
  endpoint:
    health:
      probes:
        enabled: true

relaydesk:
  session-token-secret: ${SESSION_TOKEN_SECRET:}
  decision-url: ${DECISION_URL:http://localhost:8081}
  decision-internal-key: ${DECISION_INTERNAL_KEY:}
  core-url: ${CORE_URL:http://localhost:8082}
  core-internal-key: ${CORE_INTERNAL_KEY:}
  attachment-dir: ${ATTACHMENT_DIR:./attachments}
  seed-enabled: ${APP_SEED:true}
  max-upload-bytes: ${MAX_UPLOAD_BYTES:10485760}

logging:
  level:
    com.relaydesk: INFO
    org.hibernate.SQL: WARN
